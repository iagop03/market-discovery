[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-discovery"
version = "0.1.0"
description = "Automated market niche discovery from public sources"
requires-python = ">=3.11"
dependencies = [
    "praw>=7.7",
    "PyGithub>=2.0",
    "aiohttp>=3.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "black>=23.0", "fastapi>=0.110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
market-discovery = "market_discovery.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/market_discovery"]
